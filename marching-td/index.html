<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Marching TD</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #173044; color: #fff; font-family: "Segoe UI", system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .outline { text-shadow: 0 2px 0 #1b1b26, 2px 0 0 #1b1b26, -2px 0 0 #1b1b26, 0 -2px 0 #1b1b26, 0 3px 4px #0008; }

    #hud { position: fixed; top: 10px; left: 10px; display: flex; gap: 8px; align-items: center; pointer-events: none; }
    .pill { display: flex; align-items: center; gap: 8px; background: linear-gradient(#1d3a5c, #102238); border: 3px solid #4e6f96; border-radius: 999px; padding: 4px 18px 4px 6px; font-weight: 900; font-size: 32px; line-height: 1; box-shadow: 0 4px 0 #0a1626; }
    .pill img { height: 42px; }
    #timer img { filter: invert(1); height: 38px; }
    #timer span { min-width: 2.3em; }
    #gold span { min-width: 1.8em; }
    #timer { transform-origin: 30px 50%; }
    #timer.low { border-color: #ff4d4d; color: #ff8a7a; background: linear-gradient(#5c1d1d, #2a0d0d); }
    #timer.pulse { animation: timerPulse .7s ease-out; }
    @keyframes timerPulse { 0% { transform: scale(1); } 30% { transform: scale(3); } 100% { transform: scale(1); } }
    /* Last five seconds: big red numbers in the middle of the screen. */
    #countdown { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); font-size: 150px; font-weight: 900; line-height: 1; color: #ff3b3b; pointer-events: none; z-index: 3;
      text-shadow: 0 5px 0 #5c0b0b, 0 0 30px #ff3b3b99, 4px 0 0 #1b1b26, -4px 0 0 #1b1b26, 0 -4px 0 #1b1b26, 0 4px 0 #1b1b26; }
    #countdown.tick { animation: tick .9s ease-out forwards; }
    @keyframes tick { 0% { opacity: 0; transform: translate(-50%, -50%) scale(1.8); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: .15; transform: translate(-50%, -50%) scale(.85); } }
    .gain { position: fixed; font-size: 20px; font-weight: 900; color: #ffe36b; pointer-events: none; z-index: 3; animation: gain .9s ease-out forwards; }
    @keyframes gain { 0% { opacity: 0; transform: translate(0, 8px) scale(.8); } 20% { opacity: 1; transform: translate(0, 0) scale(1.1); } 100% { opacity: 0; transform: translate(0, -26px) scale(1); } }
    #gold { color: #ffe36b; }
    #gold.bump { animation: bump .25s ease-out; }
    @keyframes bump { 50% { transform: scale(1.15); } }
    /* Rotating tip line: 3x the old 13 px, capped by width so it still wraps cleanly on a phone. */
    #hook { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); width: min(92vw, 900px); text-align: center; font-size: min(39px, 7vw); line-height: 1.1; font-weight: 900; color: #fff7dc; pointer-events: none; text-wrap: balance; transition: opacity .45s; }
    #hook.out { opacity: 0; }
    #bar { transform-origin: 50% 100%; }

    #bar { position: fixed; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; gap: 6px; }
    /*
     * Card = Harbor Rush frame (393 x 678 image, inner window 14-85% across, 23-90% down, empty ornament
     * band above) at 88 px wide, the most four cards can take on a 390 px phone. The frame is shifted up to
     * trim that band; the art is clipped to the window with the frame's chamfered corners; cost sits on the
     * bottom emblem; stats ride under the card: HP and attack on one row, move speed below.
     */
    .card { position: relative; width: 88px; height: 177px; padding: 0; border: 0; background: none; color: #fff; font: inherit; cursor: pointer; transition: transform .08s, filter .15s; -webkit-tap-highlight-color: transparent; }
    .card:active { transform: scale(.93); }
    .card .window { position: absolute; left: 13px; top: 20px; width: 63px; height: 102px; overflow: hidden; background: #102238;
      clip-path: polygon(7px 0, calc(100% - 7px) 0, 100% 7px, 100% calc(100% - 7px), calc(100% - 7px) 100%, 7px 100%, 0 calc(100% - 7px), 0 7px); }
    .card .art { width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; display: block; }
    .card .window::after { content: ""; position: absolute; inset: 0 0 auto 0; height: 28px; background: linear-gradient(#0b1422d9, #0b142200); }
    .card .frame { position: absolute; left: 0; top: -15px; width: 88px; height: 152px; pointer-events: none; }
    .card .role { position: absolute; left: 13px; width: 63px; top: 23px; font-size: 11px; font-weight: 900; letter-spacing: .04em; text-align: center; }
    .card .cost { position: absolute; left: 50%; top: 114px; transform: translateX(-50%); display: flex; align-items: center; gap: 3px; background: #102238; border: 2px solid #ffe36b; border-radius: 999px; padding: 1px 8px 1px 3px; font-size: 15px; font-weight: 900; line-height: 1.1; color: #ffe36b; }
    .card .cost img { height: 16px; }
    .card .stats { position: absolute; left: 0; right: 0; top: 140px; display: grid; grid-template-columns: 1fr 1fr; background: #0e1628e6; border: 1px solid #2c4666; border-radius: 7px; overflow: hidden; pointer-events: none; }
    .card .stat { height: 17px; display: flex; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 900; line-height: 1; color: #fff; font-variant-numeric: tabular-nums; }
    .card .stat.hp { color: #b9f5b0; border-bottom: 1px solid #2c4666; }
    .card .stat.atk { border-left: 1px solid #2c4666; border-bottom: 1px solid #2c4666; }
    .card .stat.move { grid-column: 1 / -1; }
    .card .stat img { width: 14px; height: 14px; }
    .card .badge { position: absolute; right: -4px; top: -2px; background: #ffe36b; color: #3a2400; border-radius: 999px; padding: 0 5px; font-size: 12px; font-weight: 900; line-height: 17px; box-shadow: 0 2px 0 #b86f0b; }
    /* Tap feedback: a spawn pops the card with a gold ring and a flash; an unaffordable tap shakes it red. */
    .card::after { content: ""; position: absolute; left: 6px; right: 6px; top: 2px; height: 128px; border-radius: 12px; pointer-events: none; opacity: 0; }
    .card.fired { animation: fired .38s ease-out, goldGlow .55s ease-out; }
    @keyframes goldGlow { 0% { filter: drop-shadow(0 0 0 #ffd23a); } 30% { filter: drop-shadow(0 0 10px #ffd23a) drop-shadow(0 0 4px #fff3b0) brightness(1.35); } 100% { filter: drop-shadow(0 0 0 #ffd23a00); } }
    /* A shine sweeps across the art. */
    .card .window::before { content: ""; position: absolute; inset: -20% auto -20% -80%; width: 60%; background: linear-gradient(100deg, #fff0, #fffc 50%, #fff0); transform: skewX(-18deg); opacity: 0; z-index: 1; }
    .card.fired .window::before { animation: shine .45s ease-out; }
    @keyframes shine { 0% { left: -80%; opacity: 1; } 100% { left: 130%; opacity: 1; } }
    .spark { position: fixed; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: radial-gradient(#fff 20%, #ffd23a 60%, #ffd23a00 70%); pointer-events: none; z-index: 3; animation: spark .55s ease-out forwards; }
    @keyframes spark { 0% { opacity: 1; transform: translate(0, 0) scale(1.3); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.4); } }
    .card.fired::after { animation: ring .5s ease-out; }
    @keyframes fired { 0% { transform: scale(.9); } 45% { transform: scale(1.12); filter: brightness(1.6); } 100% { transform: scale(1); } }
    @keyframes ring { 0% { opacity: 1; box-shadow: 0 0 0 0 #ffe36b, inset 0 0 18px #fff8; } 100% { opacity: 0; box-shadow: 0 0 0 12px #ffe36b00, inset 0 0 0 #fff0; } }
    .card.denied { animation: denied .32s ease-in-out; }
    .card.denied::after { animation: deny .32s ease-out; }
    @keyframes denied { 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }
    @keyframes deny { 0% { opacity: 1; background: #ff4d4d55; } 100% { opacity: 0; background: #ff4d4d00; } }
    .spend { position: fixed; transform: translate(-50%, 0); font-size: 22px; font-weight: 900; color: #ffe36b; pointer-events: none; animation: spend .9s ease-out forwards; z-index: 3; }
    @keyframes spend { 0% { opacity: 0; transform: translate(-50%, 6px) scale(.8); } 15% { opacity: 1; transform: translate(-50%, -6px) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -58px) scale(1); } }
    .card[aria-disabled="true"] { filter: grayscale(.85) brightness(.7); }
    .card.hint { animation: hint 1s ease-in-out infinite; }
    @keyframes hint { 50% { transform: translateY(-6px) scale(1.05); } }
    #glow { position: fixed; width: 170px; height: 170px; margin: -85px 0 0 -85px; pointer-events: none; opacity: .8; animation: spin 4s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #arrow { position: fixed; width: 54px; height: 54px; margin-left: -27px; pointer-events: none; transform: rotate(-90deg); animation: nudge .8s ease-in-out infinite; }
    @keyframes nudge { 50% { transform: translateY(10px) rotate(-90deg); } }
    [hidden] { display: none !important; }

    #toast { position: fixed; left: 50%; bottom: 186px; transform: translateX(-50%); background: #102238e6; border-radius: 10px; padding: 6px 12px; font-size: 14px; font-weight: 700; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
    #toast.show { opacity: 1; }

    #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #173044; z-index: 5; }
    #loading div { width: 220px; height: 12px; border-radius: 999px; background: #0b1a2a; overflow: hidden; border: 2px solid #4e6f96; }
    #loading span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #3d89c5, #8cc2ea); }

    #end { position: fixed; inset: 0; display: grid; place-items: center; background: #06101cb8; z-index: 4; }
    #end section { width: min(340px, 88vw); background: linear-gradient(#1d3a5c, #102238); border: 3px solid #4e6f96; border-radius: 22px; overflow: hidden; text-align: center; box-shadow: 0 10px 30px #000a; animation: pop .4s cubic-bezier(.3,1.5,.5,1); }
    @keyframes pop { from { transform: scale(.6); opacity: 0; } }
    #end .shot { display: block; width: 100%; aspect-ratio: 724 / 543; object-fit: cover; }
    #end .logo { width: 70%; margin: 14px auto 0; display: block; }
    #end h2 { margin: 8px 0 2px; font-size: 34px; font-weight: 900; color: #ffe36b; }
    #end.defeat h2 { color: #ff8a7a; }
    #end p { margin: 0 18px 16px; color: #dfe8f5; font-size: 15px; }
    .end-actions { display: flex; justify-content: center; align-items: center; gap: 10px; padding: 16px 12px 20px; }
    #retry { font: inherit; font-size: 18px; font-weight: 900; color: #e8f1ff; padding: 11px 18px; border: 2px solid #4e6f96; border-radius: 16px; background: linear-gradient(#2a4a72, #16304e); box-shadow: 0 4px 0 #0a1626; cursor: pointer; }
    #cta { margin: 0; font: inherit; font-size: 22px; font-weight: 900; color: #3a2400; padding: 12px 38px; border: 0; border-radius: 16px; background: linear-gradient(#ffe36b, #f5a623); box-shadow: 0 5px 0 #b86f0b; cursor: pointer; animation: hint 1.1s ease-in-out infinite; }
  </style>
</head>
<body>
  <canvas></canvas>
  <div id="hud">
    <div id="timer" class="pill outline"><img src="./art/ui/timer.png" alt=""><span>1:00</span></div>
    <div id="gold" class="pill outline"><img src="./art/ui/coin.png" alt=""><span>0</span></div>
  </div>
  <div id="hook" class="outline">The right troop order breaks any defense</div>
  <div id="bar">
    <button class="card" type="button" data-kind="tank" aria-label="Spawn tank">
      <span class="window"><img class="art" src="./art/ui/cards/crownguard.webp" onerror="this.onerror=null;this.src='./art/ui/cards/lora.webp'" alt=""></span><img class="frame" src="./art/ui/cards/frame_common.webp" alt="">
      <span class="role outline">TANK</span>
      <span class="cost"><img src="./art/ui/coin.png" alt=""><b></b></span>
      <span class="stats"><span class="stat hp"><img src="./art/ui/lobby/stat_heart.webp" alt="HP"><b data-stat="hp"></b></span><span class="stat atk"><img src="./art/ui/lobby/stat_sword.webp" alt="Attack"><b data-stat="damage"></b></span><span class="stat move"><img src="./art/ui/lobby/stat_boots.webp" alt="Move speed"><b data-stat="move"></b></span></span>
    </button>
    <button class="card" type="button" data-kind="warrior" aria-label="Spawn axe warrior">
      <span class="window"><img class="art" src="./art/ui/cards/raider.webp" alt=""></span><img class="frame" src="./art/ui/cards/frame_common.webp" alt="">
      <span class="role outline">WARRIOR</span>
      <span class="cost"><img src="./art/ui/coin.png" alt=""><b></b></span>
      <span class="stats"><span class="stat hp"><img src="./art/ui/lobby/stat_heart.webp" alt="HP"><b data-stat="hp"></b></span><span class="stat atk"><img src="./art/ui/lobby/stat_sword.webp" alt="Attack"><b data-stat="damage"></b></span><span class="stat move"><img src="./art/ui/lobby/stat_boots.webp" alt="Move speed"><b data-stat="move"></b></span></span>
    </button>
    <button class="card" type="button" data-kind="archer" aria-label="Spawn archer">
      <span class="window"><img class="art" src="./art/ui/cards/ladystriker.webp" alt=""></span><img class="frame" src="./art/ui/cards/frame_rare.webp" alt="">
      <span class="role outline">ARCHER</span>
      <span class="cost"><img src="./art/ui/coin.png" alt=""><b></b></span>
      <span class="stats"><span class="stat hp"><img src="./art/ui/lobby/stat_heart.webp" alt="HP"><b data-stat="hp"></b></span><span class="stat atk"><img src="./art/ui/lobby/stat_sword.webp" alt="Attack"><b data-stat="damage"></b></span><span class="stat move"><img src="./art/ui/lobby/stat_boots.webp" alt="Move speed"><b data-stat="move"></b></span></span>
    </button>
    <button class="card" type="button" data-kind="swarm" aria-label="Spawn a pack of three">
      <span class="window"><img class="art" alt=""></span><img class="frame" src="./art/ui/cards/frame_common.webp" alt="">
      <span class="role outline">PIP</span><span class="badge">×3</span>
      <span class="cost"><img src="./art/ui/coin.png" alt=""><b></b></span>
      <span class="stats"><span class="stat hp"><img src="./art/ui/lobby/stat_heart.webp" alt="HP"><b data-stat="hp"></b></span><span class="stat atk"><img src="./art/ui/lobby/stat_sword.webp" alt="Attack"><b data-stat="damage"></b></span><span class="stat move"><img src="./art/ui/lobby/stat_boots.webp" alt="Move speed"><b data-stat="move"></b></span></span>
    </button>
  </div>
  <img id="glow" src="./art/ui/tutorial/glow_circle.png" alt="" hidden>
  <img id="arrow" src="./art/ui/tutorial/arrow.png" alt="" hidden>
  <div id="toast"></div>
  <div id="countdown" class="outline" hidden></div>
  <div id="loading"><div><span></span></div></div>
  <div id="end" hidden>
    <section>
      <img class="logo" src="./art/ui/logo.png" alt="Harbor Rush">
      <h2 class="outline">VICTORY!</h2>
      <p>The HQ fell and the treasure is yours.</p>
      <img class="shot" src="./art/ui/postgame/level_victory.webp" alt="">
      <div class="end-actions"><button id="retry" type="button">RETRY</button><button id="cta" type="button">PLAY NOW</button></div>
    </section>
  </div>
  <script src="./dist/game.js"></script>
</body>
</html>
